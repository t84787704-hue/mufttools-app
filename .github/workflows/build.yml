name: Build Debug & Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore Files
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f mufttools-release.jks.base64 ]; then
            base64 -d mufttools-release.jks.base64 > mufttools-release.jks
            base64 -d mufttools-release.jks.base64 > app/mufttools-release.jks
          fi

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuftTools-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
