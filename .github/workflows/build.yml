name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore Release Keystore
        run: |
          if [ -f mufttools-release.jks.base64 ]; then
            base64 -d mufttools-release.jks.base64 > mufttools-release.jks
            cp mufttools-release.jks app/mufttools-release.jks
          fi

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MuftTools-Release-APK
          path: app/build/outputs/apk/release/*.apk